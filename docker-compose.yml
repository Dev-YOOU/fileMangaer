services:
  # Laravel API
  app:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile.dev
    container_name: lara_api
    restart: unless-stopped
    environment:
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_HOST_READ: ${DB_HOST_READ}
      DB_PORT: ${DB_PORT:-3306}
    working_dir: /var/www
    volumes:
      - ./BackEnd:/var/www
    networks:
      - app-network
    depends_on:
      - db-primary
      # - db-replica
      # - typesense

  # Nginx for Laravel
  nginx:
    image: nginx:stable-alpine
    container_name: ngx_server
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8000}:80"
    volumes:
      - ./BackEnd:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network
      
  phpmyadmin:
      image: phpmyadmin/phpmyadmin
      container_name: myadmin
      restart: always
      ports:
        - "8001:80"
      environment:
        PMA_ARBITRARY: 1
      depends_on:
        - db-primary
      networks:
        - app-network
  
  # MySQL Primary (Master)
  db-primary:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db-primary-data:/var/lib/mysql
      - ./docker/mysql/primary.cnf:/etc/mysql/conf.d/my.cnf
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-primary-data:
  
